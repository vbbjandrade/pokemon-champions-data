name: Generate regulation data

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/generate-regulations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    # Avoid committing again after this workflow's generated-data commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: chmod +x ./scripts/fetch_sources.sh
      - run: ./scripts/fetch_sources.sh
      - run: bun run generate

      - name: Deploy dist to data branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 1. Create a temporary index and stage dist contents at root
          export GIT_INDEX_FILE=.git/temp_index
          git read-tree --prefix=/ $(git hash-object -t tree /dev/null)
          git add -f dist

          # 2. Extract dist directory tree ID and write a commit
          TREE_ID=$(git write-tree --prefix=dist)
          COMMIT_ID=$(echo "chore: regenerate regulation data [skip ci]" | git commit-tree $TREE_ID)

          # 3. Force push the commit to the remote data branch
          git push -f origin $COMMIT_ID:refs/heads/data