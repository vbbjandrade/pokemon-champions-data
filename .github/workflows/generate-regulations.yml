name: Generate regulation data

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/generate-regulations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    # Avoid committing again after this workflow's generated-data commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: chmod +x ./scripts/fetch_sources.sh
      - run: ./scripts/fetch_sources.sh
      - run: bun run generate

      - name: Push dist to data branch
        run: |
          # 1. Initialize a clean git tree inside dist
          cd dist
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # 2. Stage everything inside dist/ as the root of the 'data' branch
          git checkout -b data
          git add -A
          
          # 3. Commit only if there are changes
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate regulation data [skip ci]'
            # Reuses the authentication already stored by actions/checkout
            git push -f origin data
          fi