name: Generate regulation data

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/generate-regulations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    # Avoid committing again after this workflow's generated-data commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: chmod +x ./scripts/fetch_sources.sh
      - run: ./scripts/fetch_sources.sh
      - run: bun run generate

      - name: Deploy dist to data branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage dist temporarily so Git can construct the tree object
          git add -f dist

          # Extract dist/ as the root of the 'data' branch and force-push to remote
          git push origin $(git subtree split --prefix dist):refs/heads/data --force