name: Generate regulation data

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/generate-regulations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    # Avoid committing again after this workflow's generated-data commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: chmod +x ./scripts/fetch_sources.sh
      - run: ./scripts/fetch_sources.sh
      - run: bun run generate

      - name: Deploy dist contents to data branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: data
          force_orphan: true