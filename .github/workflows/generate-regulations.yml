name: Generate regulation data

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/generate-regulations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    # Avoid committing again after this workflow's generated-data commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: chmod +x ./scripts/fetch_sources.sh
      - run: ./scripts/fetch_sources.sh
      - run: bun run generate

      - name: Deploy dist to data branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 1. Switch to a clean temporary orphan branch
          git checkout --orphan temp-data-branch
          git reset

          # 2. Add dist contents to index forcefully
          git add -f dist

          # 3. Create a clean working directory with dist/ contents at root level
          git mv dist/* .
          git rm -rf --cached dist/

          # 4. Commit and force push to origin/data
          git commit -m "chore: regenerate regulation data [skip ci]"
          git push -f origin temp-data-branch:data